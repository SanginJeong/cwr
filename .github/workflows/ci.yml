name: CI

# 테스트 3층 (ADR-008): 순수 함수(Vitest) → DB·RLS(PGlite) → 화면 흐름(Playwright, Supabase 로컬 스택)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 타입·lint·단위·DB 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run test:db

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # 마이그레이션까지 적용된 새 DB. 데모 데이터는 E2E의 global.setup이 reset-demo로 만든다
      - run: supabase start
      - run: npm run e2e:env
        env:
          SUPABASE_BIN: supabase

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
