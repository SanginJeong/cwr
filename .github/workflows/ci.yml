name: CI

# 테스트 3층 (ADR-008): 순수 함수(Vitest) → DB·RLS(PGlite) → 화면 흐름(Playwright, Supabase 로컬 스택)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # nightly: 평일 09:00 KST (UTC 00:00). KST 자정 근처는 날짜 경계라 피한다 (ADR-008). P2까지 전부
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "V2 스크린샷 기준 이미지를 새로 만든다 (아티팩트 e2e-snapshots를 받아 커밋)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 타입·lint·단위·DB 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next-env.d.ts·라우트 타입은 Next가 만든다 (gitignore). 타입 체크 전에 생성
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run test:db

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # 마이그레이션까지 적용된 새 DB. 테스트 데이터는 E2E의 global.setup이 e2e/seed로 만든다
      - run: supabase start
      - run: npm run e2e:env
        env:
          SUPABASE_BIN: supabase

      - run: npx playwright install --with-deps chromium
      # PR·push는 P0·P1만, nightly·수동 실행은 P2(@p2: 모바일 일부, 접근성, 스크린샷)까지
      - run: npx playwright test ${{ env.GREP }} ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
        env:
          CI: true
          # `조건 && '' || x`는 ''가 거짓이라 항상 x가 된다. 그래서 PR·push일 때 값을 넣는 쪽으로 쓴다
          GREP: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '--grep-invert @p2' || '' }}

      - uses: actions/upload-artifact@v4
        # 테스트가 실패해도 새로 만든 기준 이미지는 올린다
        if: ${{ !cancelled() && inputs.update_snapshots }}
        with:
          name: e2e-snapshots
          path: e2e/**/*-snapshots/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
